name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "client/web/**"
      - "client/cocos/**"
      - "admin/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "client/web/**"
      - "client/cocos/**"
      - "admin/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: aa_game
          MYSQL_USER: aa_game
          MYSQL_PASSWORD: testpassword
          MYSQL_ROOT_PASSWORD: testrootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptestrootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate browser client
        working-directory: .
        run: node client/web/test-client.mjs
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn --batch-mode verify
      - name: Validate Docker Compose configuration
        working-directory: .
        run: docker compose config --quiet
      - name: MySQL-backed end-to-end smoke test
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/aa_game?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME: aa_game
          DB_PASSWORD: testpassword
          PORT: 8080
          SPRING_DATA_REDIS_HOST: 127.0.0.1
          SPRING_DATA_REDIS_PORT: 6379
          APP_SECURITY_RATE_LIMIT_REDIS_ENABLED: "true"
        run: |
          java -jar target/aa-game-api-0.1.0-SNAPSHOT.jar > /tmp/aa-game-api.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/api/health >/dev/null; then break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then cat /tmp/aa-game-api.log; exit 1; fi
            sleep 2
          done
          curl --silent --show-error --fail http://127.0.0.1:8080/api/health
          curl --silent --show-error --fail http://127.0.0.1:8080/api/games
          curl --silent --show-error --fail -X POST http://127.0.0.1:8080/api/auth/register -H 'Content-Type: application/json' -d '{"email":"ci-player@example.com","password":"StrongPassword123!"}'
          TOKEN=$(curl --silent --show-error --fail -X POST http://127.0.0.1:8080/api/auth/login -H 'Content-Type: application/json' -d '{"email":"ci-player@example.com","password":"StrongPassword123!"}' | jq -r '.accessToken')
          test -n "$TOKEN" && test "$TOKEN" != "null"
          BALANCE=$(curl --silent --show-error --fail http://127.0.0.1:8080/api/auth/me/demo-credits -H "Authorization: Bearer $TOKEN" | jq -r '.balance')
          test "$BALANCE" = "1000"
          SESSION=$(curl --silent --show-error --fail -X POST http://127.0.0.1:8080/api/games/skyline-crash/sessions -H "Authorization: Bearer $TOKEN")
          SESSION_ID=$(printf '%s' "$SESSION" | jq -r '.sessionId')
          curl --silent --show-error --fail -X POST "http://127.0.0.1:8080/api/games/sessions/$SESSION_ID/complete" -H "Authorization: Bearer $TOKEN" | jq -e '.status == "COMPLETED"' >/dev/null
          for attempt in $(seq 1 9); do
            CODE=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:8080/api/auth/login -H 'Content-Type: application/json' -d '{"email":"ci-player@example.com","password":"IncorrectPassword123!"}')
            test "$CODE" = "401"
          done
          CODE=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:8080/api/auth/login -H 'Content-Type: application/json' -d '{"email":"ci-player@example.com","password":"IncorrectPassword123!"}')
          test "$CODE" = "429"
          docker run --rm --network host -e BASE_URL=http://127.0.0.1:8080 -e VUS=5 -e DURATION=10s -v "$GITHUB_WORKSPACE/loadtest/auth-smoke.js:/scripts/auth-smoke.js:ro" grafana/k6:0.56.0 run /scripts/auth-smoke.js
      - name: Build container image
        run: docker build --tag aa-game-api:ci .
      - name: Run container against MySQL
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/aa_game?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME: aa_game
          DB_PASSWORD: testpassword
        run: |
          docker run --detach --network host --name aa-game-api-container \
            --env DB_URL="$DB_URL" --env DB_USERNAME="$DB_USERNAME" \
            --env DB_PASSWORD="$DB_PASSWORD" --env PORT=8080 aa-game-api:ci
          trap 'docker rm --force aa-game-api-container >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8080/api/health >/dev/null; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' aa-game-api-container)" != "true" ]; then docker logs aa-game-api-container; exit 1; fi
            sleep 2
          done
          curl --silent --show-error --fail http://127.0.0.1:8080/api/health
          curl --silent --show-error --fail http://127.0.0.1:8080/api/games
