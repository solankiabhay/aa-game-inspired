name: Operations Validation

on:
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "deploy/**"
      - "database/*.sh"
      - "loadtest/**"
      - ".gitignore"
      - ".github/workflows/operations-ci.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "deploy/**"
      - "database/*.sh"
      - "loadtest/**"
      - ".gitignore"
      - ".github/workflows/operations-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local Compose config
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate production Compose config
        env:
          APP_DOMAIN: example.com
          MYSQL_DATABASE: aa_game
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_only_password
          MYSQL_ROOT_PASSWORD: ci_only_root_password
          REDIS_PASSWORD: ci_only_redis_password
          MAIL_FROM: no-reply@example.com
          SMTP_HOST: smtp.example.com
          SMTP_PORT: "587"
          SMTP_USERNAME: ci_user
          SMTP_PASSWORD: ci_only_smtp_password
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Validate Caddy configuration syntax
        run: docker run --rm -e APP_DOMAIN=example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate shell scripts
        run: sh -n database/backup.sh database/restore.sh
      - name: Verify production secrets are not tracked
        run: |
          test -z "$(git ls-files .env.prod)"
          test -z "$(git ls-files backups)"
