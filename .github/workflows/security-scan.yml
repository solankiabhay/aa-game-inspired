name: Security Scanning

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "client/**"
      - "admin/**"
      - "database/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "deploy/**"
      - "loadtest/**"
      - ".env.example"
      - ".github/workflows/security-scan.yml"
      - ".github/workflows/operations-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "client/**"
      - "admin/**"
      - "database/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/security-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan repository history for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 git /repo --redact --verbose

  filesystem-scan:
    name: Scan dependencies, secrets and misconfiguration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.58.1 fs \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress /repo
