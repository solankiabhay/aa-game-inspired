spring:
  application:
    name: aa-game-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/aa_game?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:aa_game}
    password: ${DB_PASSWORD:local_dev_only}
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: ${PORT:8080}
