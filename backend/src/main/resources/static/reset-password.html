<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Password recovery — AA Game Demo</title>
  <style>body{font:16px system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:24px;background:#101522;color:#eef2ff}main{background:#1b2435;padding:28px;border-radius:16px}label{display:block;margin:18px 0 8px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #52627a;background:#111a2a;color:#fff}button{margin-top:18px;background:#356ae6;border:0;font-weight:700}p{line-height:1.5;color:#c7d2e5}a{color:#8ec5ff}</style>
</head>
<body><main><h1>Password recovery</h1>
<p id="intro">Request a one-time reset link by email.</p>
<form id="requestForm"><label for="email">Account email</label><input id="email" type="email" maxlength="254" autocomplete="email" required><button type="submit">Send reset link</button></form>
<form id="resetForm" hidden><label for="password">New password</label><input id="password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required><button type="submit">Set new password</button></form>
<p id="status" role="status"></p><p><a href="/">Return to the demo lobby</a></p></main>
<script>
(function () {
  const status = document.getElementById('status');
  const requestForm = document.getElementById('requestForm');
  const resetForm = document.getElementById('resetForm');
  const intro = document.getElementById('intro');
  const token = new URLSearchParams(location.hash.slice(1)).get('token');
  history.replaceState(null, '', location.pathname + location.search);
  if (token) {
    requestForm.hidden = true;
    resetForm.hidden = false;
    intro.textContent = 'Choose a new password with at least 12 characters.';
  }
  requestForm.addEventListener('submit', async function (event) {
    event.preventDefault();
    status.textContent = 'Sending request…';
    try {
      const response = await fetch('/api/auth/password-reset/request', {method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body:JSON.stringify({email:document.getElementById('email').value.trim()})});
      const data = await response.json();
      status.textContent = response.ok ? data.message : (data.message || 'Could not submit the request.');
    } catch (_) { status.textContent = 'Could not reach the server. Check your connection and try again.'; }
  });
  resetForm.addEventListener('submit', async function (event) {
    event.preventDefault();
    if (!token) { status.textContent = 'The link is missing or expired. Request a new password reset email.'; return; }
    const password = document.getElementById('password').value;
    if (password.length < 12) { status.textContent = 'Use at least 12 characters.'; return; }
    status.textContent = 'Updating password…';
    try {
      const response = await fetch('/api/auth/password-reset/confirm', {method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body:JSON.stringify({token,newPassword:password})});
      const data = await response.json();
      status.textContent = response.ok ? 'Password changed. Sign in with your new password.' : (data.message || 'The link is invalid or expired.');
      if (response.ok) resetForm.hidden = true;
    } catch (_) { status.textContent = 'Could not reach the server. Check your connection and try again.'; }
  });
})();
</script></body></html>
