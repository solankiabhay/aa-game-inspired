<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Verify email — AA Game Demo</title>
  <style>body{font:16px system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:24px;background:#101522;color:#eef2ff}main{background:#1b2435;padding:28px;border-radius:16px}p{line-height:1.5;color:#c7d2e5}a{color:#8ec5ff}</style>
</head>
<body><main><h1>Verify your email</h1><p id="status">Checking your one-time verification link…</p><p><a href="/">Return to the demo lobby</a></p></main>
<script>
(async function () {
  const status = document.getElementById('status');
  const token = new URLSearchParams(location.hash.slice(1)).get('token');
  history.replaceState(null, '', location.pathname + location.search);
  if (!token) { status.textContent = 'The link is missing or expired. Register again or request a new verification email.'; return; }
  try {
    const response = await fetch('/api/auth/verify-email', {method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body:JSON.stringify({token})});
    const data = await response.json();
    status.textContent = response.ok ? 'Email verified. You can now sign in.' : (data.message || 'The link is invalid or expired.');
  } catch (_) { status.textContent = 'Could not reach the server. Check your connection and try again.'; }
})();
</script></body></html>
