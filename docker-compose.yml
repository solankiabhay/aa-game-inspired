services:
  mysql:
    image: mysql:8.4
    container_name: aa-game-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aa_game}
      MYSQL_USER: ${MYSQL_USER:-aa_game}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_dev_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_only}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-local_root_only}"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aa-game-api
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-aa_game}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-aa_game}
      DB_PASSWORD: ${MYSQL_PASSWORD:-local_dev_only}
      PORT: 8080
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
volumes:
  mysql_data:
