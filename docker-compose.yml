services:
  mysql:
    image: mysql:8.4
    container_name: aa-game-mysql
    environment:
      MYSQL_DATABASE: aa_game
      MYSQL_USER: aa_game
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_dev_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_only}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-local_root_only}"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mysql_data:
